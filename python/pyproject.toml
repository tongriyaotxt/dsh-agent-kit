[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-agent-kit"
version = "1.9.0"
description = "Self-proof for AI-written code: cases green + mutations caught"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dsh-agent-kit contributors" }]
keywords = ["ai", "mutation-testing", "self-verification", "agent", "dsh", "jsonl"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/tongriyaotxt/dsh-agent-kit"

[project.scripts]
dsh-agent-kit = "dsh_agent_kit.cli:main"
dsh-agent-gateway = "dsh_agent_kit.gateway:main"

[tool.setuptools]
packages = ["dsh_agent_kit"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
