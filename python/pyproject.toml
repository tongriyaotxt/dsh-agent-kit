[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qed-kit"
version = "1.9.0"
description = "Make AI-written code prove itself: cases pass AND mutations get caught."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "qed contributors" }]
keywords = ["ai", "mutation-testing", "self-verification", "agent", "dsh", "jsonl"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/tongriyaotxt/qed"

[project.scripts]
qed = "qed.cli:main"
qed-gateway = "qed.gateway:main"

[tool.setuptools]
packages = ["qed"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
