<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-label="dsh-agent-kit demo: self-proof holds, then fails when the assertion is weakened">
  <defs>
    <style>
      .bg      { fill: #0d1117; }
      .bar     { fill: #161b22; }
      .dot-r   { fill: #ff5f56; }
      .dot-y   { fill: #ffbd2e; }
      .dot-g   { fill: #27c93f; }
      .fg      { fill: #c9d1d9; }
      .dim     { fill: #6e7681; }
      .green   { fill: #3fb950; }
      .red     { fill: #f85149; }
      .yellow  { fill: #d29922; }
      .cyan    { fill: #79c0ff; }
      .bold    { font-weight: 600; }
      text     { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; }
      .t12 { font-size: 12px; }
      .t14 { font-size: 14px; }
      .t16 { font-size: 16px; }
    </style>
    <clipPath id="round"><rect x="0" y="0" width="920" height="430" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect class="bg" width="920" height="430"/>
    <rect class="bar" width="920" height="36"/>
    <circle class="dot-r" cx="20" cy="18" r="6"/>
    <circle class="dot-y" cx="40" cy="18" r="6"/>
    <circle class="dot-g" cx="60" cy="18" r="6"/>
    <text class="dim t12" x="460" y="23" text-anchor="middle">dsh-agent-kit demo — no deps · no API key · no network · really runs</text>

    <!-- 1 -->
    <text class="dim" x="26" y="66">[1/5]</text>
    <text class="fg bold" x="86" y="66">scaffold an app — it is</text>
    <text class="red bold" x="274" y="66">deliberately red</text>
    <text class="dim t12" x="86" y="86">logic.py contains exactly:  return {"todo": True}</text>

    <!-- 2 -->
    <text class="dim" x="26" y="116">[2/5]</text>
    <text class="fg bold" x="86" y="116">the state right now</text>
    <text class="cyan t12" x="86" y="136">$ python verify.py</text>
    <text class="fg t12" x="86" y="154">invoice-stats · 0/2 cases pass</text>
    <text class="red t12" x="96" y="172">FAIL c1   expect {"count": 2, "total": 123.5}   got {"todo": true}</text>
    <text class="red t12" x="96" y="190">FAIL c2   expect {"count": 0, "total": 0}       got {"todo": true}</text>

    <!-- 3 -->
    <text class="dim" x="26" y="220">[4/5]</text>
    <text class="fg bold" x="86" y="220">prove it — not just “it runs”</text>
    <text class="cyan t12" x="86" y="240">$ python verify.py --mutate</text>
    <text class="fg t12" x="86" y="258">invoice-stats · 2/2 cases pass · 4/4 mutations caught</text>
    <text class="green bold t12" x="96" y="276">SELF-PROOF HOLDS ✓</text>

    <!-- 4 -->
    <text class="dim" x="26" y="306">[5/5]</text>
    <text class="fg bold" x="86" y="306">now weaken the assertion</text>
    <text class="cyan t12" x="86" y="326">$ python verify.py --mutate</text>
    <text class="fg t12" x="86" y="344">weak-cases · 1/1 cases pass · 1/2 mutations caught</text>
    <text class="yellow t12" x="96" y="362">survivors:</text>
    <text class="yellow t12" x="106" y="378">- len → constant 0   (no case caught it)</text>
    <text class="red bold t12" x="96" y="396">SELF-PROOF FAILS: 1/2 mutations survived</text>
  </g>

  <rect x="0.5" y="0.5" width="919" height="429" rx="12" fill="none" stroke="#30363d"/>
</svg>
